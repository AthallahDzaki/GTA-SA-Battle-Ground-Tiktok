; GTA SA Battle Ground TikTok Configuration
; This file contains all settings for the mod

[Match]
; Minimum number of NPCs required to start a match
MinNPCsToStart=2
; Countdown time in seconds before match starts
CountdownSeconds=5
; Delay in seconds after one NPC remains before declaring winner
WinnerDelaySeconds=10
; Automatically start match when minimum NPCs reached
AutoStartMatch=true

[Spawn]
; Center coordinates for spawn area (Los Santos default)
CenterX=2488.0
CenterY=-1666.0
CenterZ=13.5
; Radius around center point for random spawning
SpawnRadius=50.0
; Minimum spawn height
MinHeight=10.0
; Maximum spawn height
MaxHeight=20.0
; Only allow one NPC per username (recommended: true)
OneNPCPerUsername=true
; Gift IDs that can spawn NPCs (comma-separated)
JoinGiftIds=rose

[WebSocket]
; WebSocket server URL for TikTok Live connection
ServerURL=ws://localhost:8080
; Automatically reconnect on connection loss
AutoReconnect=true
; Interval in seconds between reconnection attempts
ReconnectIntervalSeconds=5
; Connection timeout in seconds
ConnectionTimeout=10

[Revive]
; Gift IDs that can revive dead NPCs (comma-separated)
ReviveGiftIds=diamond,rose_gold,galaxy
; Health percentage after revive (0-100)
ReviveHealthPercent=50
; Invulnerability duration after revive in seconds
InvulnerabilitySeconds=3
; Require gift sender to match dead NPC owner
RequireOwnerMatch=true

[Weapons]
; Default weapon ID (22 = 9mm pistol)
DefaultWeaponId=22
; Use random weapons from list
UseRandomWeapons=true
; Available weapon IDs (comma-separated)
; 22=9mm, 24=Desert Eagle, 25=Shotgun, 28=Micro SMG, 29=MP5, 30=AK-47, 31=M4
WeaponList=22,24,25,28,29,30,31

[Camera]
; Base camera movement speed
MoveSpeed=1.0
; Multiplier when holding Shift
FastSpeedMultiplier=3.0
; Multiplier when holding Ctrl
SlowSpeedMultiplier=0.3
; Mouse sensitivity for camera rotation
MouseSensitivity=0.002
; Enable auto-follow for active combat
AutoFollowEnabled=false
; Minimum distance from target when auto-following
AutoFollowDistance=15.0

[UI]
; Show username above NPC head
ShowNPCNames=true
; Show health bars above NPCs
ShowHealthBars=true
; Show kill count statistics
ShowKillCount=true
; Show match status overlay
ShowMatchStatus=true
; Duration in seconds for notifications
NotificationDuration=5.0
; Show gift received notifications
ShowGiftNotifications=true
